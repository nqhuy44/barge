<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BARGE</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Ensure canvas covers screen behind UI */
      canvas {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <!-- MAIN MENU LAYER -->
    <div id="main-menu-layer">
      <div class="menu-container">
        <div class="title-box">
          <div class="game-title" data-i18n="menu.title">HÚC!</div>
          <div class="tagline" data-i18n="menu.tagline">Húc chết mẹ nó!</div>
        </div>

        <div class="toy-panel">
          <div class="input-group">
            <label class="label" data-i18n="menu.name_label"
              >01 - Tên của bạn</label
            >
            <input
              type="text"
              id="menu-player-name"
              class="input-field"
              placeholder="Nhập biệt danh..."
              data-i18n-placeholder="menu.placeholder_name"
              maxlength="12"
            />
          </div>

          <div class="divider" data-i18n="menu.start_divider">BẮT ĐẦU CHƠI</div>

          <button
            id="btn-create-room"
            class="btn btn-create"
            data-i18n="menu.create_btn"
          >
            Tạo Phòng 👑
          </button>

          <div class="divider" data-i18n="menu.join_divider">
            HOẶC VÀO PHÒNG
          </div>

          <div class="join-row">
            <input
              type="text"
              id="menu-room-code"
              class="input-field code-input"
              placeholder="123456"
              data-i18n-placeholder="menu.code_placeholder"
              maxlength="6"
            />
            <button
              id="btn-join-room"
              class="btn btn-join"
              data-i18n="menu.join_btn"
            >
              Vào Ngay ▶
            </button>
          </div>
        </div>

        <div
          style="
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 500;
            margin-top: 1rem;
          "
          data-i18n="menu.footer"
        >
          v0.1.0-mvp • Built by Huy Nguyen
        </div>
      </div>
    </div>
    <div id="ui-layer" class="hidden">
      <div class="container">
        <div class="toy-panel header-panel">
          <div class="room-info">
            <div class="room-badge" id="room-badge">123456</div>
            <span class="player-count" id="player-count">3/8 Players</span>
          </div>

          <button
            class="btn-action start"
            id="btn-start"
            data-i18n="lobby.start_btn"
          >
            START GAME ▶
          </button>
        </div>

        <div class="content-wrapper">
          <div class="col-left">
            <div class="toy-panel color-panel">
              <div class="section-header" data-i18n="lobby.colors_label">
                Colors
              </div>
              <div class="color-grid" id="color-grid">
                <div class="color-btn bg-red"></div>
                <div class="color-btn bg-blue active"></div>
                <div class="color-btn bg-green"></div>
                <div class="color-btn bg-yellow"></div>
                <div class="color-btn bg-purple"></div>
                <div class="color-btn bg-pink"></div>
                <div class="color-btn bg-orange"></div>
                <div class="color-btn bg-cyan"></div>
              </div>
            </div>

            <div class="toy-panel player-panel">
              <div class="section-header" data-i18n="lobby.players_label">
                Players
              </div>
              <div class="player-list" id="player-list">
                <div class="player-card">
                  <div class="p-avatar bg-blue"></div>
                  <div class="p-info">
                    <div class="p-name">PlayerOne (You)</div>
                    <div class="p-host">HOST</div>
                  </div>
                  <div
                    class="p-status status-ready"
                    data-i18n="lobby.ready_status"
                  >
                    Ready
                  </div>
                </div>

                <div class="player-card">
                  <div class="p-avatar bg-red"></div>
                  <div class="p-info">
                    <div class="p-name">BargeMaster99</div>
                  </div>
                  <div
                    class="p-status status-ready"
                    data-i18n="lobby.ready_status"
                  >
                    Ready
                  </div>
                </div>

                <div class="player-card">
                  <div class="p-avatar bg-yellow"></div>
                  <div class="p-info">
                    <div class="p-name">NoobSlayer</div>
                  </div>
                  <div
                    class="p-status status-waiting"
                    data-i18n="lobby.waiting_status"
                  >
                    Waiting...
                  </div>
                </div>

                <div class="player-card empty" data-i18n="lobby.empty_slot">
                  Empty Slot
                </div>
              </div>
            </div>
          </div>

          <div class="col-right" style="width: 100%">
            <div class="toy-panel chat-panel">
              <div
                class="section-header"
                style="padding: 1rem 1rem 0"
                data-i18n="lobby.chat_label"
              >
                CHAT
              </div>
              <div class="chat-body" id="chat-body"></div>
              <div class="chat-footer">
                <input
                  type="text"
                  class="chat-input"
                  id="chat-input"
                  placeholder="Type your message..."
                  data-i18n-placeholder="lobby.chat_placeholder"
                />
                <button class="btn-send" id="btn-send">➤</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
