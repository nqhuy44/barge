upstream barge_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name _;

    root /var/www/barge/web/dist;
    index index.html;

    # Serve Static Files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy WebSocket to Go Backend
    location /ws {
        proxy_pass http://barge_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
